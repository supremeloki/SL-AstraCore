name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # httpx2 backs starlette's TestClient on recent FastAPI; without it every
          # module importing testclient fails at collection.
          pip install pytest pytest-asyncio ruff mypy types-PyYAML httpx2
          pip install -e .

      # -rfE lists every failure in the summary. Without it a run that failed
      # for a reason the reporter cannot reproduce showed nothing but the
      # progress dots, which is how this stayed undiagnosed for several runs.
      - name: Tests
        # bash, because PIPESTATUS is how pytest's exit code survives being
        # piped through tee. The default shell is pwsh on Windows runners,
        # where the pipeline reports tee's code instead and a failed run looks
        # green — which is exactly the state this workflow was in.
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q --tb=short -rfE 2>&1 | tee tests-output.txt
          # PIPESTATUS[0] is pytest's own code, not tee's.
          code=${PIPESTATUS[0]}
          echo "pytest exit code: $code"
          exit $code
        env:
          STRICT_KPI: "1"

      - name: Lint
        run: python -m ruff check astra/ tests/ dashboard_app.py

      - name: Types
        run: python -m mypy astra/ dashboard_app.py --python-version ${{ matrix.python-version }}

      # The job-log endpoint returns 401 for every token available to the person
      # fixing this, so a red build was undiagnosable. An issue is readable.
      #
      # This publishes what the failing step actually printed. It used to re-run
      # the suite itself, which meant the issue showed a green run whenever the
      # real failure depended on the step's environment — several Windows
      # failures were reported as "282 passed" this way.
      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OS_NAME: ${{ matrix.os }}
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          set +e
          {
            echo "### $OS_NAME / Python $PY_VERSION @ ${{ github.sha }}"
            echo
            echo '```'
            if [ -f tests-output.txt ]; then
              tail -c 50000 tests-output.txt
            else
              echo "(the Tests step wrote no output)"
            fi
            echo '```'
            echo
            echo "Linting and types, run separately:"
            echo '```'
            python -m ruff check astra/ tests/ dashboard_app.py 2>&1 | tail -40
            python -m mypy astra/ dashboard_app.py --python-version "$PY_VERSION" 2>&1 | tail -40
            echo '```'
          } > body.md
          if command -v gh >/dev/null 2>&1; then
            gh issue create --title "CI failure: $OS_NAME / Python $PY_VERSION @ ${{ github.sha }}" --body-file body.md || true
          else
            cat body.md
          fi

      - name: Keep the failure text
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ matrix.os }}-py${{ matrix.python-version }}
          path: tests-output.txt
          if-no-files-found: ignore
