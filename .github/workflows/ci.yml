name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # httpx2 backs starlette's TestClient on recent FastAPI; without it every
          # module importing testclient fails at collection.
          pip install pytest pytest-asyncio ruff mypy types-PyYAML httpx2
          pip install -e .

      - name: Tests
        run: python -m pytest tests/ -q --tb=short
        env:
          STRICT_KPI: "1"

      # The job-log endpoint is not readable with the token available here, so a
      # red build is undiagnosable. Publish the failure into a job output, which
      # the checks API does expose.
      - name: Diagnose failure
        if: failure()
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q --tb=short -x > failure.txt 2>&1
          echo "exit=$?" >> failure.txt
          tail -c 60000 failure.txt

      - name: Lint
        run: python -m ruff check astra/ tests/ dashboard_app.py

      - name: Types
        run: python -m mypy astra/ dashboard_app.py --python-version ${{ matrix.python-version }}
