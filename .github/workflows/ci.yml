name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff mypy types-PyYAML
          pip install -e .

      - name: Tests
        run: python -m pytest tests/ -q
        env:
          STRICT_KPI: "1"

      - name: Lint
        run: python -m ruff check astra/ tests/ dashboard_app.py

      - name: Types
        run: python -m mypy astra/ dashboard_app.py --python-version ${{ matrix.python-version }}
