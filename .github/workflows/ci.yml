name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # httpx2 backs starlette's TestClient on recent FastAPI; without it every
          # module importing testclient fails at collection.
          pip install pytest pytest-asyncio ruff mypy types-PyYAML httpx2
          pip install -e .

      - name: Tests
        run: python -m pytest tests/ -q --tb=short
        env:
          STRICT_KPI: "1"

      - name: Lint
        run: python -m ruff check astra/ tests/ dashboard_app.py

      - name: Types
        run: python -m mypy astra/ dashboard_app.py --python-version ${{ matrix.python-version }}

      # The job-log endpoint returns 401 for every token available to the person
      # fixing this, so a red build was undiagnosable. An issue is readable.
      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OS_NAME: ${{ matrix.os }}
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          set +e
          # gh ships with the hosted runners but not with self-hosted ones;
          # the artifact below carries the same text either way.
          command -v gh >/dev/null 2>&1 || echo "note: gh is not installed, skipping the issue" >&2
          python -m pytest tests/ -q --tb=long -x > failure.txt 2>&1
          python -m ruff check astra/ tests/ dashboard_app.py >> failure.txt 2>&1
          python -m mypy astra/ dashboard_app.py --python-version "$PY_VERSION" >> failure.txt 2>&1
          {
            echo "### $OS_NAME / Python $PY_VERSION @ ${{ github.sha }}"
            echo
            echo '```'
            tail -c 50000 failure.txt
            echo '```'
          } > body.md
          if command -v gh >/dev/null 2>&1; then
            gh issue create --title "CI failure: $OS_NAME / Python $PY_VERSION @ ${{ github.sha }}" --body-file body.md || true
          fi

      - name: Keep the failure text
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ matrix.os }}-py${{ matrix.python-version }}
          path: failure.txt
          if-no-files-found: ignore
