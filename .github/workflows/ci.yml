name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # httpx2 backs starlette's TestClient on recent FastAPI; without it every
          # module importing testclient fails at collection.
          pip install pytest pytest-asyncio ruff mypy types-PyYAML httpx2
          pip install -e .

      - name: Tests
        run: |
          set -o pipefail
          python -m pytest tests/ -q --tb=long 2>&1 | tee pytest-output.txt
        env:
          STRICT_KPI: "1"

      - name: Upload failure detail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest-output.txt
          if-no-files-found: ignore

      - name: Lint
        run: python -m ruff check astra/ tests/ dashboard_app.py

      - name: Types
        run: python -m mypy astra/ dashboard_app.py --python-version ${{ matrix.python-version }}

