# SL-AstraCore configuration.
# Only keys the code reads are listed here; anything absent falls back to
# astra/core/config.py _DEFAULTS.

scanner:
  max_file_size_kb: 1024
  follow_symlinks: false
  respect_astraignore: true
  include_hidden: true
  worker_count: 1
  streaming_buffer: 65536
  hash_algorithm: sha256
  checkpoint_path: ""
  checkpoint_every: 1000

agent:
  # Task execution providers.
  #   generic - echo fallback (always available)
  #   codex   - runs the real Codex CLI, skipped when the binary is absent
  #   manual  - renders a task brief for human / VS Code execution
  providers:
    - generic

storage:
  engine: duckdb
