[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astra"
version = "1.0.0"
description = "Repository Cognitive Intelligence Platform — scan a codebase, build a knowledge graph, and ship agent-ready context packs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "tree-sitter>=0.21.0",
    "tree-sitter-language-pack>=0.5.0",
    "duckdb>=0.9.0",
    "watchdog>=3.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sse-starlette>=1.6",
]

[project.scripts]
astra = "astra.cli:main"

# dashboard_app.py, dashboard_real.html and static/ are loaded by path at
# runtime (Path(__file__).parent), so they must ship alongside the package for
# `astra serve` to work from an installed wheel.
[tool.setuptools]
py-modules = ["dashboard_app"]

[tool.setuptools.package-data]
astra = ["../dashboard_real.html", "../static/icons/*.png", "../favicon.ico", "../manifest.webmanifest"]

[tool.setuptools.packages.find]
include = ["astra*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["psutil"]
ignore_missing_imports = true
